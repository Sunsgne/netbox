<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}ZENLENET 运营台{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <strong>ZENLENET</strong>
      <span>运营台</span>
    </div>
    <nav>
      <a class="{% if request.url.path == '/' %}active{% endif %}" href="/">总览</a>
      <a class="{% if request.url.path.startswith('/customers') %}active{% endif %}" href="/customers">客户</a>
      <a class="{% if request.url.path.startswith('/orders') %}active{% endif %}" href="/orders">订单</a>
      <a class="{% if request.url.path.startswith('/resources') %}active{% endif %}" href="/resources">资源</a>
      <a class="{% if request.url.path.startswith('/billing') %}active{% endif %}" href="/billing">出账</a>
      <a class="{% if request.url.path.startswith('/tickets') %}active{% endif %}" href="/tickets">割接 / 维护</a>
      <a class="{% if request.url.path.startswith('/circuits') %}active{% endif %}" href="/circuits">专线</a>
      <a class="{% if request.url.path.startswith('/suppliers') %}active{% endif %}" href="/suppliers">供应商</a>
    </nav>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn" type="submit">退出 {{ username }}</button>
    </form>
  </aside>
  <main class="main">
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
