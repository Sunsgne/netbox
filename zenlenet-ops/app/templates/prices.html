{% extends "base.html" %}
{% block title %}价目 · ZENLENET{% endblock %}
{% block content %}
<div class="top">
  <div><h1>演示价目</h1><div class="muted">台账里没有合同单价，这里的数字只用于把出账流程跑通。</div></div>
  <a class="btn" href="/billing">返回账单</a>
</div>
<form class="panel stack" method="post" action="/billing/prices">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% for row in rows %}
  <label>{{ row.name }}（USD）<input name="amount_{{ row.code }}" value="{{ row.amount }}" inputmode="decimal"></label>
  {% endfor %}
  <button class="btn primary" type="submit">保存</button>
</form>
{% endblock %}
